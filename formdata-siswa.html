<!DOCTYPE html>
<html>
<head>
    <title>Form Data Siswa</title>
</head>
<body>
    <center>
        <table border="1" cellpadding="20">
            <tr>
                <td>
                    <h2 align="center">FORM DATA SISWA</h2>
                    <hr>
                    <form>
                        <table border="0" cellpadding="3">
                            <tr><td>Username</td><td>:</td><td><input type="text"></td></tr>
                            <tr><td>Password</td><td>:</td><td><input type="password"></td></tr>
                            <tr><td>Nama Lengkap</td><td>:</td><td><input type="text"></td></tr>
                            <tr><td>No. Handphone</td><td>:</td><td><input type="tel"></td></tr>
                            <tr><td>E-Mail</td><td>:</td><td><input type="email"></td></tr>
                            <tr>
                                <td>Jenis Kelamin</td><td>:</td>
                                <td>
                                    <input type="radio" name="jk">Pria
                                    <input type="radio" name="jk">wanita
                                </td>
                            </tr>
                            <tr>
                                <td valign="top">Hobi</td><td valign="top">:</td>
                                <td>
                                    <input type="checkbox">Menyanyi<br>
                                    <input type="checkbox">Olahraga<br>
                                    <input type="checkbox">Membaca
                                </td>
                            </tr>
                            <tr>
                                <td>Kompetensi Keahlian</td><td>:</td>
                                <td>
                                    <select>
                                        <option value="rpl">Rekayasa Perangkat Lunak</option>
                                        <option value="mp">Management Perkantoran</option>
                                        <option value="bd">Bisnis Digital</option>
                                        <option value="ak">Akuntansi</option>
                                        <option value="lp">Layanan Perbankan</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td valign="top">Alamat</td><td valign="top">:</td>
                                <td><textarea rows="4" cols="20"></textarea></td>
                            </tr>
                        </table>
                        <hr>
                        <input type="submit" value="Kirim">
                        <input type="reset" value="Reset">
                    </form>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
